<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de la Compra Familiar - LOPEZ MELENDO</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen pb-10 font-sans">

  <!-- Encabezado -->
  <header class="bg-indigo-600 text-white p-4 shadow-md sticky top-0 z-10">
    <div class="max-w-md mx-auto flex justify-between items-center">
      <div>
        <h1 class="text-xl font-bold flex items-center gap-2">
          🛒 Compra Familiar
        </h1>
        <p class="text-xs text-indigo-200">Código: <span class="font-bold text-yellow-300">LOPEZ MELENDO</span></p>
      </div>
      <span class="bg-indigo-700 text-xs px-2 py-1 rounded-full text-indigo-100">Activo</span>
    </div>
  </header>

  <main class="max-w-md mx-auto p-4 space-y-4">

    <!-- Formulario para Añadir Productos -->
    <form onsubmit="addItem(event)" class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-3">
      <div>
        <input type="text" id="itemName" placeholder="¿Qué falta comprar? (ej. Leche, Tomates...)" 
               class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
      </div>
      
      <div class="flex gap-2">
        <input type="text" id="itemQty" placeholder="Cant. (1, 500g...)" value="1"
               class="w-1/3 px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
        
        <select id="itemCategory" class="w-2/3 px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm bg-white">
          <option value="📦 Varios">📦 Varios</option>
          <option value="🥦 Frutas y Verduras">🥦 Frutas y Verduras</option>
          <option value="🥛 Lácteos">🥛 Lácteos</option>
          <option value="🍞 Panadería">🍞 Panadería</option>
          <option value="🥩 Carne y Pescado">🥩 Carne y Pescado</option>
          <option value="🧃 Bebidas">🧃 Bebidas</option>
          <option value="🧼 Limpieza e Higiene">🧼 Limpieza e Higiene</option>
          <option value="❄️ Congelados">❄️ Congelados</option>
        </select>
      </div>

      <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 rounded-lg text-sm transition flex items-center justify-center gap-1">
        ➕ Añadir a la lista
      </button>
    </form>

    <!-- Filtros -->
    <div class="flex justify-between items-center text-xs text-slate-600 bg-white p-2 rounded-lg border border-slate-200">
      <div class="flex gap-1">
        <button type="button" onclick="setFilter('all')" id="filter-all" class="px-2 py-1 rounded bg-indigo-100 text-indigo-700 font-semibold">Todos</button>
        <button type="button" onclick="setFilter('pending')" id="filter-pending" class="px-2 py-1 rounded hover:bg-slate-100">Pendientes</button>
        <button type="button" onclick="setFilter('bought')" id="filter-bought" class="px-2 py-1 rounded hover:bg-slate-100">Comprados</button>
      </div>
      <button type="button" onclick="clearBought()" class="text-red-500 hover:underline">Borrar comprados</button>
    </div>

    <!-- Lista de Artículos -->
    <div id="shoppingList" class="space-y-2"></div>

  </main>

  <script>
    const STORAGE_KEY = 'lista_compra_lopez_melendo';
    let currentFilter = 'all';

    function getItems() {
      const saved = localStorage.getItem(STORAGE_KEY);
      return saved ? JSON.parse(saved) : [];
    }

    function saveItems(items) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
      renderList();
    }

    function addItem(event) {
      if (event) event.preventDefault();

      const nameInput = document.getElementById('itemName');
      const qtyInput = document.getElementById('itemQty');
      const catInput = document.getElementById('itemCategory');

      const name = nameInput.value.trim();
      const qty = qtyInput.value.trim() || '1';
      const category = catInput.value;

      if (!name) {
        alert('Por favor escribe el nombre de un producto');
        return;
      }

      const items = getItems();
      
      // Comprobar si ya existe pendiente
      const existing = items.find(i => i.name.toLowerCase() === name.toLowerCase() && !i.bought);
      if (existing) {
        alert('¡Este producto ya está en la lista pendiente!');
        return;
      }

      items.push({
        id: Date.now(),
        name: name,
        qty: qty,
        category: category,
        bought: false
      });

      saveItems(items);
      nameInput.value = '';
      qtyInput.value = '1';
      nameInput.focus();
    }

    function toggleBought(id) {
      const items = getItems().map(item => {
        if (item.id === id) item.bought = !item.bought;
        return item;
      });
      saveItems(items);
    }

    function deleteItem(id) {
      const items = getItems().filter(item => item.id !== id);
      saveItems(items);
    }

    function clearBought() {
      if (confirm('¿Quieres eliminar los artículos comprados?')) {
        const items = getItems().filter(item => !item.bought);
        saveItems(items);
      }
    }

    function setFilter(filter) {
      currentFilter = filter;
      ['all', 'pending', 'bought'].forEach(f => {
        const btn = document.getElementById(`filter-${f}`);
        if (f === filter) {
          btn.className = 'px-2 py-1 rounded bg-indigo-100 text-indigo-700 font-semibold';
        } else {
          btn.className = 'px-2 py-1 rounded hover:bg-slate-100';
        }
      });
      renderList();
    }

    function renderList() {
      const container = document.getElementById('shoppingList');
      let items = getItems();

      if (currentFilter === 'pending') items = items.filter(i => !i.bought);
      if (currentFilter === 'bought') items = items.filter(i => i.bought);

      if (items.length === 0) {
        container.innerHTML = `
          <div class="text-center py-8 text-slate-400 text-sm">
            No hay productos en esta sección.
          </div>`;
        return;
      }

      // Agrupar por categoría
      const grouped = {};
      items.forEach(item => {
        if (!grouped[item.category]) grouped[item.category] = [];
        grouped[item.category].push(item);
      });

      let html = '';
      for (const [category, list] of Object.entries(grouped)) {
        html += `<div class="font-semibold text-xs text-slate-500 mt-3 mb-1 px-1">${category}</div>`;
        list.forEach(item => {
          html += `
            <div class="bg-white p-3 rounded-lg border border-slate-200 flex items-center justify-between gap-2 shadow-sm ${item.bought ? 'opacity-60 bg-slate-50' : ''}">
              <div class="flex items-center gap-3 cursor-pointer flex-1" onclick="toggleBought(${item.id})">
                <input type="checkbox" ${item.bought ? 'checked' : ''} class="w-4 h-4 text-indigo-600 rounded pointer-events-none">
                <div>
                  <span class="text-sm font-medium ${item.bought ? 'line-through text-slate-400' : 'text-slate-800'}">${item.name}</span>
                  <span class="text-xs text-slate-400 ml-1">(${item.qty})</span>
                </div>
              </div>
              <button type="button" onclick="deleteItem(${item.id})" class="text-slate-400 hover:text-red-500 text-xs px-2 py-1">❌</button>
            </div>
          `;
        });
      }

      container.innerHTML = html;
    }

    // Cargar la lista inicial al abrir la página
    renderList();
  </script>

</body>
</html>
